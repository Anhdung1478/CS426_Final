server.port=8080

# The key is read from the environment and never stored here. Empty default on purpose:
# a missing key produces a readable 503 at call time rather than a startup stack trace.
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com/chat/completions
deepseek.model=deepseek-chat
