plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lexicondepths'
    compileSdk 35
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.lexicondepths"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 10.0.2.2 is the emulator's alias for the host machine. A physical device needs the
        // laptop's LAN IP, which Settings (P3-9) overrides at runtime so this never needs editing.
        buildConfigField "String", "MAP_API_BASE_URL", '"http://10.0.2.2:8080"'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    testImplementation 'junit:junit:4.13.2'
    // Test scope only, so no APK cost: the SDK's org.json is a stub in unit tests, and MapJson
    // is the P3-1 trust boundary — it has to be tested on the JVM, not only on a device.
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
